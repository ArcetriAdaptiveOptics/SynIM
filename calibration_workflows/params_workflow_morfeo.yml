# MORFEO Calibration Workflow Parameters
# 
# Input files and execution settings of the automated calibration workflow.
# The parameters of the system and of the calibration are in the base
# simulation YAML.

workflow:
  # Workflow metadata
  name: "MORFEO_MCAO_Calibration"
  description: "Automated calibration pipeline for MORFEO MCAO system"
  version: "1.0"

# =============================================================================
# INPUT FILES
# =============================================================================
input_files:
  # Main MORFEO simulation YAML (template)
  # This can be:
  # - Relative path (relative to workflow YAML location)
  # - Absolute path
  # - null (will be provided via command line)
  base_simulation_yml: "params_morfeo_simplified.yml"
  
  # Directory containing parameter YAML files
  # If null, uses the directory of this workflow YAML file
  params_dir: null

# =============================================================================
# CALIBRATION FILES
# =============================================================================
calibration_files:
  # Subaperture calibration YAML
  # Path relative to params_dir
  # Set to null to auto-detect (looks for calib_morfeo_*_subaps.yml)
  subap_calib_yml: "calib_morfeo_simplified_subaps.yml"

# All the physical and calibration parameters are read from the base
# simulation YAML, the single source of truth:
# - SPECULA sections: main (pupil sampling), seeing (r0 at zenith), atmo (L0,
#   FoV), dmN and layerN (heights);
# - SynIM-only sections, removed for the simulation: calibration (pupil mask,
#   actuators, filter matrices, focus reconstructor), reconstruction (noise,
#   modes per DM) and projection (regularization, optical sources, weights).

# =============================================================================
# WORKFLOW EXECUTION
# =============================================================================
execution:
  # Device configuration
  device_idx: 0  # GPU device (-1 for CPU)
  
  # File handling
  overwrite: false  # Whether to overwrite existing calibration files
  
  # Workflow outputs (timestamped), relative to root_dir
  output_dirs:
    workflow: "workflow"

  # Compute the atmospheric covariances on CPU (the GPU computation can run
  # out of memory). Covariances already saved in covariance/ are loaded anyway.
  skip_gpu_covariance: true

  # Steps to run (0-10), used when --steps is not given
  # Set to null or [] to run all steps
  steps: null
  
  # Verbosity
  verbose: true
